<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="theme-color" content="#070b14">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.title | escape }}">
    <meta property="og:description" content="{{ site.description | escape }}">
    <meta property="og:image" content="https://jyotis34.github.io/jyotirmoy_equation_reveal.gif">
    <title>{{ site.title | default: site.github.repository_name | escape }} · Portfolio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232dd4bf'/%3E%3Cstop offset='1' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23070b14'/%3E%3Crect x='1.5' y='1.5' width='61' height='61' rx='12.5' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3Ctext x='32' y='41' font-family='Arial, sans-serif' font-size='24' font-weight='700' text-anchor='middle' fill='url(%23g)'%3EJS%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>

  <body>
    <a class="skip-link" href="#pageContent">Skip to content</a>

    <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>

    <header class="site-nav" id="siteNav">
      <nav class="nav-inner" aria-label="Primary">
        <a class="nav-brand" href="#top" aria-label="Jyotirmoy Saikia — back to top">
          <span class="brand-mark" aria-hidden="true">JS</span>
        </a>

        <ul class="nav-links" id="navLinks">
          <li><a href="#about-me" data-spy>About</a></li>
          <li><a href="#core-technologies" data-spy>Skills</a></li>
          <li><a href="#featured-work" data-spy>Projects</a></li>
          <li><a href="#achievements-research" data-spy>Achievements</a></li>
        </ul>

        <div class="nav-actions">
          <a class="btn btn-primary btn-compact" id="navResume" href="#resume">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Resume
          </a>
          <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navMenu">
            <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
            <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
          </button>
        </div>
      </nav>

      <div class="nav-menu" id="navMenu">
        <a href="#about-me">About</a>
        <a href="#core-technologies">Skills</a>
        <a href="#featured-work">Projects</a>
        <a href="#achievements-research">Achievements</a>
        <a class="nav-menu-cta" id="navResumeMobile" href="#resume">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download Resume
        </a>
      </div>
    </header>

    <main id="top">
      <section class="hero" aria-label="Introduction">
        <div class="hero-text">
          <p class="hero-eyebrow" id="heroEyebrow"></p>
          <h1 class="hero-title">{{ site.title | default: site.github.repository_name | escape }}<span class="title-dot" aria-hidden="true">.</span></h1>
          <p class="hero-lede">{{ site.description | escape }}</p>
          <div class="hero-meta" id="heroMeta"></div>
          <div class="hero-social" id="heroSocial"></div>
        </div>
        <div class="hero-visual" id="heroVisual"></div>
      </section>

      <div class="page-content container" id="pageContent">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p class="footer-copy" id="footerCopy"></p>
        <p class="footer-credits">
          Project maintained by <a href="https://github.com/JyotiS34" target="_blank" rel="noopener noreferrer">JyotiS34</a>
          <span aria-hidden="true">·</span> Hosted on GitHub Pages
        </p>
      </div>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
